<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemax.uz - Saralangan Loyihalar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 22px;
            margin: 0;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }
        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--accent-color);
        }
        
        /* Bo'limlar (Kategoriyalar) tugmalari */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none; /* Scrollbar yashirish */
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .category-btn {
            background: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .category-btn.active {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            font-weight: bold;
        }

        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .project-card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 10px;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
        }
        .project-card:active {
            transform: scale(0.98);
            background: #273548;
        }
        .project-img-real {
            width: 60px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #334155;
        }
        .project-info {
            margin-left: 12px;
            flex-grow: 1;
        }
        .project-title {
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 4px 0;
        }
        .project-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0 0 6px 0;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            font-size: 10px;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 CINEMAX.UZ</h1>
        <p>Barcha turdagi tarjima loyihalar</p>
    </div>

    <input type="text" class="search-box" placeholder="Kino, serial yoki animeni qidirish...">

    <!-- Bo'limlar ro'yxati -->
    <div class="categories">
        <button class="category-btn active">Barchasi</button>
        <button class="category-btn">🎭 Drama</button>
        <button class="category-btn">🍿 Serial</button>
        <button class="category-btn">⚡ Anime</button>
        <button class="category-btn">🎬 Film</button>
        <button class="category-btn">🎨 Multfilm</button>
    </div>

    <!-- Loyihalar ro'yxati -->
    <div class="projects-list">
        
        <!-- 1-LOYIHA: Drama -->
        <a href="https://t.me/c/3926949961/4" class="project-card">
            <img src="beg'ubor qasoskor.jpg" alt="Beg'ubor Qasoskor" class="project-img-real">
            <div class="project-info">
                <h3 class="project-title">Beg'ubor Qasoskor</h3>
                <p class="project-desc">80 qism | O'zbek tilida</p>
                <span class="badge">Mini Drama / VIP</span>
            </div>
        </a>

    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>

</body>
</html>
