<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama Mini App</title>
    <!-- Telegram Web App kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
        }
        .project-card {
            background: #1e293b;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 10px;
        }
        .btn:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <h2>🎬 Bizning Loyihalar</h2>

    <div class="project-card">
        <h3>Loyihalar: Xitoy qisqa seriallari</h3>
        <p>Barcha tarjima qilingan qismlar va VIP kontentlar shu yerda.</p>
        <button class="btn" onclick="openEpisodes()">Ko'rish</button>
    </div>

    <script>
        // Telegram Web App obyektini faollashtirish
        let tg = window.Telegram.WebApp;
        tg.expand(); // Mini App'ni to'liq ekranga ochish

        function openEpisodes() {
            alert("Tez kunda barcha qismlar yuklanadi!");
        }
    </script>

</body>
</html>
